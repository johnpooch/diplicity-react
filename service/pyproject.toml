[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
python_files = ["test*.py"]
# test_replay runs full-game fixture replays and takes ~15 minutes.
# test_dumbbot_match plays two full games to Spring 1910 with real LLM
# calls, so it costs tokens and tens of minutes.
# Both are excluded from the default run (CI and local); invoke explicitly
# when needed: `pytest integration/test_replay.py` or
# `pytest integration/test_dumbbot_match.py`.
addopts = "--ignore=integration/test_replay.py --ignore=integration/test_dumbbot_match.py"

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"rest_framework.serializers.SerializerMethodField".msg = "Read a model field or property with source=, an AbsoluteUrlField, or an attribute set by a hydrator on the serializer's loader. See docs/django-app-architecture.md."
"rest_framework.fields.SerializerMethodField".msg = "Read a model field or property with source=, an AbsoluteUrlField, or an attribute set by a hydrator on the serializer's loader. See docs/django-app-architecture.md."
