components:
  schemas:
    AddableUser:
      type: object
      properties:
        user_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        picture:
          type: string
          readOnly: true
          nullable: true
      required:
      - name
      - picture
      - user_id
    AppleAuth:
      type: object
      properties:
        id_token:
          type: string
          writeOnly: true
        first_name:
          type: string
          writeOnly: true
        last_name:
          type: string
          writeOnly: true
        id:
          type: integer
          readOnly: true
        email:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        access_token:
          type: string
          readOnly: true
        refresh_token:
          type: string
          readOnly: true
      required:
      - access_token
      - email
      - id
      - id_token
      - name
      - refresh_token
    Channel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        private:
          type: boolean
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChannelMessage'
          readOnly: true
        unread_message_count:
          type: integer
          readOnly: true
          default: 0
        member_ids:
          type: array
          items:
            type: integer
          writeOnly: true
      required:
      - id
      - member_ids
      - messages
      - name
      - private
      - unread_message_count
    ChannelMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          nullable: true
          readOnly: true
        name:
          type: string
          readOnly: true
        picture:
          type: string
          nullable: true
          readOnly: true
        is_current_user:
          type: boolean
          readOnly: true
        is_bot:
          type: boolean
          readOnly: true
        commitment:
          type: string
          nullable: true
          readOnly: true
        nation:
          allOf:
          - $ref: '#/components/schemas/Nation'
          nullable: true
      required:
      - commitment
      - id
      - is_bot
      - is_current_user
      - name
      - nation
      - picture
      - user_id
    ChannelMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        body:
          type: string
          maxLength: 500
        sender:
          allOf:
          - $ref: '#/components/schemas/ChannelMember'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - sender
    CommitmentEligibilityEnum:
      enum:
      - eligible
      - committed_locked
      - low_locked
      type: string
      description: |-
        * `eligible` - eligible
        * `committed_locked` - committed_locked
        * `low_locked` - low_locked
    CommitmentRequirementEnum:
      enum:
      - open
      - committed
      type: string
      description: |-
        * `open` - Open
        * `committed` - Committed
    DeadlineModeEnum:
      enum:
      - duration
      - fixed_time
      type: string
      description: |-
        * `duration` - Duration
        * `fixed_time` - Fixed Time
    DrawProposal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/DrawVoteMember'
          readOnly: true
        status:
          type: string
          readOnly: true
        accepted_count:
          type: integer
          readOnly: true
        rejected_count:
          type: integer
          readOnly: true
        pending_count:
          type: integer
          readOnly: true
        total_votes:
          type: integer
          readOnly: true
        included_member_ids:
          type: array
          items:
            type: integer
          readOnly: true
        my_vote:
          allOf:
          - $ref: '#/components/schemas/MyVote'
          nullable: true
          readOnly: true
        phase_id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accepted_count
      - created_at
      - created_by
      - id
      - included_member_ids
      - my_vote
      - pending_count
      - phase_id
      - rejected_count
      - status
      - total_votes
    DrawVoteMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          nullable: true
          readOnly: true
        name:
          type: string
          readOnly: true
        picture:
          type: string
          nullable: true
          readOnly: true
        is_current_user:
          type: boolean
          readOnly: true
        is_bot:
          type: boolean
          readOnly: true
        commitment:
          type: string
          nullable: true
          readOnly: true
        nation:
          type: string
          nullable: true
      required:
      - commitment
      - id
      - is_bot
      - is_current_user
      - name
      - nation
      - picture
      - user_id
    DrawVoteUpdate:
      type: object
      properties:
        accepted:
          type: boolean
      required:
      - accepted
    DurationEnum:
      enum:
      - 1 hour
      - 2 hours
      - 4 hours
      - 8 hours
      - 12 hours
      - 24 hours
      - 48 hours
      - 3 days
      - 4 days
      - 1 week
      - 2 weeks
      type: string
      description: |-
        * `1 hour` - 1 hour
        * `2 hours` - 2 hours
        * `4 hours` - 4 hours
        * `8 hours` - 8 hours
        * `12 hours` - 12 hours
        * `24 hours` - 24 hours
        * `48 hours` - 48 hours
        * `3 days` - 3 days
        * `4 days` - 4 days
        * `1 week` - 1 week
        * `2 weeks` - 2 weeks
    EmailLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        access_token:
          type: string
          readOnly: true
        refresh_token:
          type: string
          readOnly: true
      required:
      - access_token
      - email
      - id
      - name
      - password
      - refresh_token
    FCMDevice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          nullable: true
          maxLength: 255
        registration_id:
          type: string
          title: Registration token
        device_id:
          type: string
          nullable: true
          description: Unique device identifier
          maxLength: 255
        active:
          type: boolean
          default: true
          title: Is active
          description: Inactive devices will not be sent notifications
        date_created:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Creation date
        type:
          $ref: '#/components/schemas/TypeEnum'
      required:
      - date_created
      - id
      - registration_id
      - type
    FieldValue:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
      - id
      - label
    FlatOrderOption:
      type: object
      properties:
