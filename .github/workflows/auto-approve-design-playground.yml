name: Auto Approve Design Playground

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Approve if the pull request only touches the design playground
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = "packages/design-playground/";

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              }
            );

            if (files.length === 0) {
              core.info("No changed files; not approving.");
              return;
            }

            const outside = files
              .map(file => file.filename)
              .filter(filename => !filename.startsWith(prefix));

            if (outside.length > 0) {
              core.info(
                `Not approving. ${outside.length} file(s) outside ${prefix}:\n` +
                  outside.slice(0, 20).join("\n")
              );
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: "APPROVE",
              body:
                "Approved automatically: every changed file is under " +
                "`packages/design-playground/`, which is exempt from review.\n\n" +
                "---\n" +
                "_Generated by [Claude Code](https://claude.ai/code)_",
            });

            core.info(`Approved: ${files.length} file(s), all under ${prefix}.`);
