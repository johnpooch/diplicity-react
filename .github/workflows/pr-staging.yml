name: PR Staging Environment
run-name: >-
  Staging ${{ github.event_name }} ${{ github.event.action || 'deploy' }} ${{ github.event.pull_request.number || 0 }}
  ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.label.name == 'deploy-to-staging' ||
       (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'deploy-to-staging'))) }}

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, closed]
  workflow_dispatch:

permissions: {}

jobs:
  skip-fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo 'Skipping fork PR; staging credentials are not available to forks.'

  deploy-staging:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' && github.event.label.name == 'deploy-to-staging') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'deploy-to-staging'))))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: staging
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: write
    env:
      RAILWAY_API_ENDPOINT: https://backboard.railway.app/graphql/v2
      STAGING_ENV_ID: 3082daa9-9287-4eef-9439-162ab737beb8
      PROD_ENV_ID: 0372f6a0-88ab-4a58-b472-16789135ad71
      DJANGO_SERVICE_ID: 5f342326-a52a-4c40-8bc1-910588628f8a
      WORKER_SERVICE_ID: 54286c74-c5c3-4bcc-95b4-817cb3eeefa8
      STAGING_URL: https://diplicity-react-staging.up.railway.app
    steps:
      - name: Check out workflow helpers
        id: helpers
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve staging target and ownership
        id: target
        uses: actions/github-script@v9
        with:
          script: |
            const resolveTarget = require('./.github/scripts/staging-target.cjs');
            await resolveTarget({ github, context, core });

      - name: Check out deployment commit
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        id: registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: service/
          file: service/Dockerfile
          target: production
          build-args: GIT_SHA=${{ steps.target.outputs.sha }}
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging
          tags: ghcr.io/johnpooch/diplicity-service:${{ steps.target.outputs.sha }}
          push: true

      - name: Verify public image access
        id: visibility
        env:
          COMMIT_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          if ! REGISTRY_TOKEN=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            'https://ghcr.io/token?scope=repository:johnpooch/diplicity-service:pull&service=ghcr.io' \
            | jq -er '.token | select(type == "string" and length > 0)'); then
            echo 'John must make ghcr.io/johnpooch/diplicity-service public in GitHub package settings before staging can deploy.' >&2
            exit 1
          fi
          echo "::add-mask::$REGISTRY_TOKEN"
          if ! curl --fail --silent --show-error --head --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $REGISTRY_TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/johnpooch/diplicity-service/manifests/$COMMIT_SHA" > /dev/null; then
            echo 'The image is not publicly pullable. John must check GitHub package visibility; Railway has not been changed.' >&2
            exit 1
          fi

      - name: Deploy Django, then worker
        id: railway
        timeout-minutes: 20
        env:
          RAILWAY_ACCOUNT_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          COMMIT_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$STAGING_ENV_ID" = "$PROD_ENV_ID" ] || [ "$STAGING_ENV_ID" != '3082daa9-9287-4eef-9439-162ab737beb8' ]; then
            echo 'Refusing to change an environment other than staging.' >&2
            exit 1
          fi

          railway_api() {
            local response
            response=$(curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $RAILWAY_ACCOUNT_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg query "$1" --argjson variables "$2" '{query: $query, variables: $variables}')" \
              "$RAILWAY_API_ENDPOINT") || return 1
            if ! jq -e '(.errors // [] | length) == 0 and .data != null' <<< "$response" > /dev/null; then
              jq '.errors // "Missing GraphQL data"' <<< "$response" >&2
              return 1
            fi
            printf '%s\n' "$response"
          }

          IMAGE="ghcr.io/johnpooch/diplicity-service:$COMMIT_SHA"
          DEADLINE=$((SECONDS + 900))
          for SERVICE_ID in "$DJANGO_SERVICE_ID" "$WORKER_SERVICE_ID"; do
            if [ "$SERVICE_ID" = "$DJANGO_SERVICE_ID" ]; then
              SERVICE_NAME=Django
            else
              SERVICE_NAME=worker
            fi
            echo "failure_step=Deploy $SERVICE_NAME" >> "$GITHUB_OUTPUT"
            VARIABLES=$(jq -n --arg environmentId "$STAGING_ENV_ID" --arg serviceId "$SERVICE_ID" \
              '{environmentId: $environmentId, serviceId: $serviceId}')
            UPDATE_VARIABLES=$(jq --arg image "$IMAGE" '. + {input: {source: {image: $image, repo: null}}}' <<< "$VARIABLES")
            railway_api 'mutation($environmentId: String!, $serviceId: String!, $input: ServiceInstanceUpdateInput!) {
              serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: $input)
            }' "$UPDATE_VARIABLES" | jq -e '.data.serviceInstanceUpdate == true'

            INSTANCE=$(railway_api 'query($environmentId: String!, $serviceId: String!) {
              serviceInstance(environmentId: $environmentId, serviceId: $serviceId) {
                source { image repo }
                service { repoTriggers { edges { node { id environmentId } } } }
              }
            }' "$VARIABLES")
            jq -e --arg image "$IMAGE" '.data.serviceInstance.source | .image == $image and .repo == null' <<< "$INSTANCE"

            while read -r TRIGGER_ID; do
              railway_api 'mutation($id: String!) { deploymentTriggerDelete(id: $id) }' \
                "$(jq -n --arg id "$TRIGGER_ID" '{id: $id}')" | jq -e '.data.deploymentTriggerDelete == true'
            done < <(jq -r --arg environmentId "$STAGING_ENV_ID" \
              '.data.serviceInstance.service.repoTriggers.edges[].node | select(.environmentId == $environmentId) | .id' <<< "$INSTANCE")

            DEPLOYMENT_ID=$(railway_api 'mutation($environmentId: String!, $serviceId: String!) {
              serviceInstanceDeployV2(environmentId: $environmentId, serviceId: $serviceId)
            }' "$VARIABLES" | jq -er '.data.serviceInstanceDeployV2 | select(type == "string" and length > 0)')
            echo "$SERVICE_NAME deployment: $DEPLOYMENT_ID"

            STATUS=''
            while [ "$SECONDS" -lt "$DEADLINE" ]; do
              STATUS=$(railway_api 'query($id: String!) { deployment(id: $id) { status } }' \
                "$(jq -n --arg id "$DEPLOYMENT_ID" '{id: $id}')" \
                | jq -er '.data.deployment.status | select(type == "string" and length > 0)')
              echo "$SERVICE_NAME deployment $DEPLOYMENT_ID: $STATUS"
              case "$STATUS" in
                SUCCESS) break ;;
                FAILED|CRASHED|REMOVED|SKIPPED) exit 1 ;;
              esac
              sleep 5
            done
            if [ "$STATUS" != SUCCESS ]; then
              echo "Timed out waiting for $SERVICE_NAME deployment $DEPLOYMENT_ID." >&2
              exit 1
            fi
          done

      - name: Smoke test seeded staging
        id: smoke
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            --data '{"email":"test-user@example.com","password":"password"}' \
            "$STAGING_URL/auth/email-login/" | jq -er '.accessToken | select(type == "string" and length > 0)')
          echo "::add-mask::$ACCESS_TOKEN"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$STAGING_URL/games/?mine=true" | jq -e '.count | type == "number" and . > 0'

      - name: Comment on deployed PR
        id: comment
        if: steps.target.outputs.pr != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          BRANCH: ${{ steps.target.outputs.branch }}
          COMMIT_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: [
                `Staging now runs \`${process.env.BRANCH}\` at \`${process.env.COMMIT_SHA.slice(0, 7)}\`.`,
                '',
                `Backend: ${process.env.STAGING_URL}`,
                `Frontend preview: https://deploy-preview-${process.env.PR_NUMBER}--diplicity-react.netlify.app`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Data is reset to the seed on every deploy. Log in with `test-user@example.com` / `password` (email/password only).',
                'The `deploy-to-staging` label stays on this PR; pushing another commit redeploys it.',
              ].join('\n'),
            });

      - name: Comment on failed deployment
        if: failure() && steps.target.outputs.pr != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          FAILED_STEP: ${{ steps.railway.outcome == 'failure' && steps.railway.outputs.failure_step || '' }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        with:
          script: |
            const failed = Object.entries(JSON.parse(process.env.STEP_RESULTS)).find(([, step]) => step.outcome === 'failure');
            const names = { target: 'Resolve staging target and ownership', checkout: 'Check out deployment commit', buildx: 'Set up Docker Buildx', registry: 'Log in to GHCR', build: 'Build and push image', visibility: 'Verify public image access', smoke: 'Smoke test seeded staging', comment: 'Comment on deployed PR' };
            const step = process.env.FAILED_STEP || names[failed?.[0]] || 'Resolve staging target and ownership';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: [
                `Staging deployment failed at **${step}**.`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Staging may be broken until the next successful deploy, because the database reset happens before migrations.',
              ].join('\n'),
            });
