services:
  codegen:
    container_name: diplicity-codegen
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/web/node_modules
      - /app/packages/native
    env_file:
      - path: .env
        required: false
    networks:
      - diplicity-network
    depends_on:
      - service
    command: >
      sh -c "python3 service/manage.py spectacular --file service/openapi-schema.yaml && python3 service/manage.py spectacular --custom-settings project.openapi.INTERNAL_SCHEMA_SETTINGS --file service/openapi-schema.internal.yaml && datamodel-codegen --input service/openapi-schema.internal.yaml --input-file-type openapi --output service/harness/generated/api.py --output-model-type typing.TypedDict --target-python-version 3.13 --use-standard-collections --use-union-operator --strict-nullable --disable-timestamp && cd /app/packages/web && npx orval --config orval.config.ts"

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules
    container_name: diplicity-web
    entrypoint: ["npm", "run", "dev"]
    ports:
      - "5173:5173"
    volumes:
      - ./packages/web:/app
      - /app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - diplicity-network

  service:
    container_name: diplicity-service
    build:
      context: ./service
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_DEBUG=True
      - ROOT_LOG_LEVEL=INFO
      - DJANGO_LOG_LEVEL=INFO
      - DB_LOG_LEVEL=WARNING
      - GAME_LOG_LEVEL=INFO
    working_dir: /app/service
    command: >
      sh -c "python manage.py migrate && gunicorn project.wsgi:application --bind 0.0.0.0:8000 --timeout 60"
    networks:
      - diplicity-network
    depends_on:
      db:
        condition: service_healthy
    tty: true


  db:
    container_name: diplicity-db
    image: postgres:17
    environment:
      POSTGRES_DB: diplicity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diplicity"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - diplicity-network

  worker:
    container_name: diplicity-worker
    build:
      context: ./service
      dockerfile: Dockerfile
      target: development
    working_dir: /app/service
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_DEBUG=True
      - ROOT_LOG_LEVEL=INFO
      - DJANGO_LOG_LEVEL=INFO
      - DB_LOG_LEVEL=WARNING
      - GAME_LOG_LEVEL=INFO
      - PROCESS_ROLE=worker
    command: >
      sh -c "python manage.py procrastinate worker"
    restart: on-failure
    networks:
      - diplicity-network
    depends_on:
      - db
      - service

networks:
  diplicity-network:
    name: diplicity-network

volumes:
  postgres_data:
